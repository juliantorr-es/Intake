[project]
name = "intake"
version = "0.1.0"
description = "Passkey-gated, locally decryptable client intake platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Intake Team" }
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlmodel>=0.0.16",
    # Duo Labs py_webauthn - package name is 'webauthn'
    "webauthn>=2.0.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
]

[project.scripts]
intake-operator = "intake.operator_console.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pyright>=1.1.350",
    "pytest-cov>=4.1.0",
]
console = [
    "pywebview>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ARG", "PLE", "PLR", "PLW", "FLY", "PERF", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PLR"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
