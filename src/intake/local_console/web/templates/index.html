<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intake Local Console</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="">
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-text">Intake</span>
            </div>
            <nav class="main-nav">
                <a href="#" class="nav-item active" id="nav-dashboard">
                    Dashboard
                </a>
                <a href="#" class="nav-item" id="nav-quotes">
                    Quotes
                </a>
                <a href="#" class="nav-item" id="nav-settings">
                    Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="status-indicator">
                    <span class="badge success">Hosted: Online</span>
                </div>
            </div>
        </aside>

        <main class="content-area">
            <header class="top-bar">
                <h1 id="page-title">Dashboard</h1>
                <div class="actions">
                    <button id="btn-sync" class="btn btn-primary">
                        <span class="icon">↻</span> Sync Now
                    </button>
                </div>
            </header>

            <section id="view-dashboard" class="view">
                <div class="grid-stats">
                    <div class="stat-card">
                        <label>Pending Quotes</label>
                        <div class="value" id="stat-pending-count">-</div>
                    </div>
                    <div class="stat-card">
                        <label>Security Level</label>
                        <div class="value"><span class="badge private">Local-only</span></div>
                    </div>
                </div>
                
                <div class="panel mt-4">
                    <h3>Connection State</h3>
                    <div class="info-list">
                        <div class="info-item">
                            <label>Hosted URL</label>
                            <span id="conf-hosted-url">...</span>
                        </div>
                        <div class="info-item">
                            <label>Sync Auth</label>
                            <span id="conf-sync-auth" class="badge info">Checking...</span>
                        </div>
                        <div class="info-item">
                            <label>Encryption Key</label>
                            <span id="conf-enc-key" class="badge private">Checking...</span>
                        </div>
                        <div class="info-item">
                            <label>Signing Key</label>
                            <span id="conf-signing-key" class="badge private">Checking...</span>
                        </div>
                    </div>
                </div>
            </section>

            <section id="view-quotes" class="view hidden">
                <div class="quote-list-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Status</th>
                                <th>Area</th>
                                <th>Uploads</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="quote-list-body">
                            <!-- Rows will be injected here -->
                        </tbody>
                    </table>
                </div>
            </section>

            <section id="view-quote-detail" class="view hidden">
                <button class="btn-back" id="btn-back-to-list">← Back to List</button>
                
                <!-- Quote Header -->
                <div class="panel">
                    <div class="detail-header">
                        <div>
                            <h2 id="detail-quote-id">Quote Details</h2>
                            <div class="header-metadata" style="display: flex; gap: 12px; margin-top: -8px;">
                                <span class="badge info" id="detail-lane">...</span>
                                <span class="badge" id="detail-area">...</span>
                                <span class="badge success" id="detail-email-verified">Email Verified</span>
                            </div>
                        </div>
                        <div class="header-actions">
                            <span class="badge warning" id="detail-status">...</span>
                            <button id="btn-start-review" class="btn btn-primary hidden">Start Review</button>
                        </div>
                    </div>
                </div>
                
                <div class="grid-detail">
                    <!-- Decrypted Content -->
                    <div class="panel highlight">
                        <h3><span class="badge private" style="margin-right: 8px;">Private</span> Decrypted Local-only View</h3>
                        <div class="info-list">
                            <div class="info-item vertical">
                                <label>Exact Location</label>
                                <div class="decrypted-box" id="detail-location">...</div>
                            </div>
                            <div class="info-item vertical">
                                <label>Access Notes</label>
                                <div class="decrypted-box" id="detail-notes">...</div>
                            </div>
                            <div class="info-item vertical">
                                <label>Questionnaire Responses</label>
                                <pre class="decrypted-box" id="detail-questionnaire">...</pre>
                            </div>
                        </div>
                    </div>

                    <!-- Upload Evidence -->
                    <div class="panel">
                        <h3>Upload Evidence</h3>
                        <div class="info-list">
                            <div class="info-item">
                                <label>Total Uploads</label>
                                <span id="detail-upload-count">0</span>
                            </div>
                            <div class="upload-evidence-list" id="detail-upload-evidence">
                                <!-- Evidence rows injected here -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
